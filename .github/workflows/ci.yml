# Lint, typecheck and the offline suite on every push to main or a release
# branch and on every pull request; the slow screen tests on Linux and macOS.
# Live tests need real engines and keys, so they stay on the maintainer's
# machine.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv run ruff check otaku/ tests/ scenarios/
      - run: uv run ruff format --check otaku/ tests/ scenarios/
      - run: uv run mypy
      # mypy checks only the branches of the platform it runs on.
      - name: mypy, as on Windows
        run: uv run mypy --platform win32
      - name: mypy, as on macOS
        run: uv run mypy --platform darwin

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # 3.15 is the newest Python: a failure there is a finding, not a red build.
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: offline suite
        if: runner.os != 'Windows'
        run: uv run pytest tests/ scenarios/ -m "not live"
      # The pseudo-terminal scenarios need pty, which Windows does not have.
      - name: offline suite, without the pseudo-terminal scenarios
        if: runner.os == 'Windows'
        run: uv run pytest tests/ scenarios/ -m "not live and not cli" --ignore=scenarios/cli

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t otaku-ci .
      # The container as compose runs it (-it): the terminal interface,
      # serving the page beside it.
      - name: The page answers from a running container
        run: |
          docker run -dit --name otaku-ci -p 9600:9600 otaku-ci
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:9600/api/app/status; then
              exit 0
            fi
            sleep 1
          done
          docker logs otaku-ci
          exit 1

  screen:
    name: slow screen tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Screens that fail now and then, a different one each run: the live
    # screen and a fresh launch's echo are each captured after a moment's
    # silence, not at the turn's end. They run apart and only warn until
    # the captures wait for the turn.
    env:
      FLAKY: >-
        scenarios/cli/test_screen.py::TestChatMode::test_every_block_echoes_as_it_played
        scenarios/cli/test_screen.py::TestStoryMode::test_every_block_flows_as_it_played
        scenarios/cli/test_screen.py::TestStoryMode::test_a_reply_cut_or_regenerated_mid_stream
        scenarios/cli/test_screen.py::TestStoryMode::test_a_failed_regenerate_keeps_the_text_open
        scenarios/cli/test_screen.py::TestStoryMode::test_an_answered_reply_keeps_every_round
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: screens
        run: uv run pytest scenarios/ --slow -m "slow and not live" $(printf -- '--deselect %s ' $FLAKY)
      - name: flaky screens
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash  # -o pipefail: the tee keeps pytest's exit status
        run: uv run pytest --slow -m "slow and not live" -rf $FLAKY | tee flaky.log
      - name: flaky screens, as warnings on the run
        if: ${{ !cancelled() && steps.flaky.outcome == 'failure' }}
        run: grep '^FAILED' flaky.log | sed 's/^/::warning title=Flaky screen test::/'
