# Lint, typecheck and the offline suite on every push to main or a release
# branch and on every pull request; the slow screen tests on Linux and macOS.
# Live tests need real engines and keys, so they stay on the maintainer's
# machine.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run ruff check otaku/ tests/ scenarios/
      - run: uv run ruff format --check otaku/ tests/ scenarios/
      - run: uv run mypy

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # 3.15 is the newest Python: a failure there is a finding, not a red build.
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: offline suite
        if: runner.os != 'Windows'
        run: uv run pytest tests/ scenarios/ -m "not live"
      # The pseudo-terminal scenarios need pty, which Windows does not have.
      - name: offline suite, without the pseudo-terminal scenarios
        if: runner.os == 'Windows'
        run: uv run pytest tests/ scenarios/ -m "not live and not cli" --ignore=scenarios/cli

  screen:
    name: slow screen tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv run pytest scenarios/ --slow -m "slow and not live"
