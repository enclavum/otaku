# Publish to PyPI when a version tag (vX.Y.Z) is pushed, then open the
# tag's GitHub release as a draft holding the same sdist, attested. PyPI
# trusts this workflow (Trusted Publishing), so no token is kept anywhere.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: github.repository == 'enclavum/otaku'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag names the version in otaku/__init__.py
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' otaku/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but otaku/__init__.py says $version."
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write  # what Trusted Publishing signs in with
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The files PyPI took, attested as this workflow's build, and the sdist
  # the release's one asset — the file the Homebrew formula fetches. A
  # draft: its body is written by hand before it is published.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the release and its asset
      id-token: write  # what the attestation is signed with
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: The draft release, the sdist its one asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sdist=$(ls dist/*.tar.gz)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$sdist"
          else
            gh release create "$GITHUB_REF_NAME" "$sdist" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --notes ""
          fi
