# The web frontend's HTTP surface as OpenAPI, maintained by hand. The
# AUTHORITY is the code: the tables in `otaku/web/api/` (`ROUTES` and
# `STREAMS`, one module per resource) and the paths `otaku/web/server/`
# holds itself. A change to the surface updates this file in the same
# commit.
#
# WHAT THIS SHAPE IS
#
#   `backend.api` over HTTP, call for call. A resource of the interface
#   is a path here, and its five verbs are the methods: `list` and `get`
#   a GET, `create` a POST, `update` a PATCH, `delete` a DELETE. A
#   sub-resource is a path below its parent, so the Python call spells
#   the URL: `api.stories.messages.create(5, line=…)` is
#   `POST /api/stories/5/messages`. An action is a resource of its own — a
#   fork, a reply, a merge, an import, the trailing exchange — never a
#   verb in a path.
#
#   Every call names what it acts on. The server holds no story for a
#   client: which story a page plays is the page's, and a request that
#   acts on one says which, in its path.
#
#   The prompt takes prose. `/me`, `/you`, `/ooc`, `/roll` and `… /cue`
#   are the story's own typed language, part of the line being played
#   and read at the far end; a line goes through verbatim. Commands are
#   the terminal's: a button here calls a resource, and `/last`, `/clear`
#   and `/quit` have no path and never will — they redraw, or they say
#   something about the tab.
#
# CONVENTIONS
#
#   Paths are kebab-case, collections plural, under `/api`. A ROW ID in a
#   path is digits — a page that lost its story cannot address
#   `/api/stories/null/…`: nothing matches, and the answer is a plain 404.
#   Every other path parameter is a NAME (a provider, a model, a setting,
#   a tool, a prompt, a picture), percent-encoded where it must be: a
#   model's name may hold a slash, sent as `%2F`.
#
#   Query parameters and JSON properties are snake_case; a boolean query
#   parameter is `true` or `false`. A representation is the interface's
#   data as JSON: its fields, an enum by its value, a datetime in ISO
#   8601, null where a value is absent — and a position names itself
#   with its text (`Position`), an amount of money is a decimal string
#   (`Money`).
#
#   A collection answers an OBJECT, `{"items": [...]}`, never a bare
#   array: an array can never grow a sibling field. The collections are
#   unbounded — one reader's machine, one client, and the page filters
#   what it already holds.
#
#   A write answers what `backend.api` answers, `Changed`:
#   `{"value": …, "notice": "…"}` — the thing as it now stands (null
#   where nothing stands: a delete, a send) and the sentence that says
#   what was done, which the page shows verbatim. Something that MAKES a
#   thing answers 201 and names where it now lives in `Location`; the
#   extraction pass, work that goes on after the answer, 202 and where
#   it is polled.
#
#   One name, one type: the chain is the collection at `…/messages`,
#   and wherever its length is a property it is `message_count`.
#
#   The journal is nobody's limb. A record IS one thing read from two
#   sides — a character's line in a scene, a scene's line by a
#   character — so it is a collection of the story's, not filed under
#   either.
#
#   Ids, not names, in a path and a body: `/merge A into B` is typed by
#   name in the terminal; here a merge names character ids, which the
#   page holds.
#
# THE HEAD
#
#   An answer about a story, or anything in it, carries
#   `ETag: "<head>"` — the id of the story's newest message, `"0"` while it
#   has none; a story's representation carries the same id as `head`.
#   A write that MOVES the head — a line played, a reply regenerated,
#   the trailing exchange taken back, a card imported, the story rewound
#   — names the head it moves from in `If-Match`: the ETag it read, or
#   `*` for the head as it stands. Missing, it is answered 428; naming a
#   head the story no longer stands at, 412, the problem's `head` and
#   the `ETag` saying where it stands now — nothing written. Everything
#   else is last writer wins. The tag names the HEAD, not the
#   representation: a title edited leaves it as it was. And it is no
#   cache validator — nothing here is cached.
#
#   A stream says no ETag: its headers go out before its messages land.
#   The head after it is the id of the last message it landed.
#
# WHEN YOU ADD OR CHANGE AN ENDPOINT
#
#   Add it to `backend.api` first: a path here is a resource there. Put
#   it in the lane its METHOD says (`info.description`) — a read that
#   moves something is a lie the lanes cannot survive. Answer a write
#   with `Changed`, a collection with `items`, and a refusal with the
#   status its kind says. Keep this file in step: the architecture test
#   holds its paths and methods against the tables.

openapi: 3.1.0

info:
  title: otaku web API
  version: 0.9.0
  contact:
    name: otaku
    url: https://otaku.sh
  description: |
    The API `otaku serve` serves the app over, on loopback by default. One
    intended client — the packaged page — so it is small, unversioned,
    and free to change with the app.

    **Lanes.** One thread owns the app — the backend's own, every request
    handed to it — and the METHOD is the lane. A `GET` only
    reads, so it is answered in the gaps of a streaming reply: between
    two frames, and on a tick while the first token is still awaited,
    which is why a screen opens while the model talks. Every other method
    takes the thread in turn, in the order it arrived. A whole exchange — the
    line recorded and its reply streamed — is ONE job: nothing can move
    the story out from under a line already accepted. A read that asks a
    provider over the network (the provider listing, the balance) holds
    the thread while it waits. `/api/app/status`, `/api/watch` and
    `/api/login` are in neither lane: they never touch the app.

    **Guards.** Every request's `Host` must name this machine — a name
    that reached the server by pointing elsewhere is DNS rebinding and is
    answered `421` (skipped on a wildcard bind, which is the decision to
    answer everyone). Every unsafe method must prove it came from otaku's
    own page — `Sec-Fetch-Site: same-origin`, or an `Origin` equal to the
    whole origin addressed — else `403`. A request with neither header (a
    script) is let through; the bind guards those. Where `[web] password`
    is set, every request but the page's own files and `/api/login` must
    carry the sign-in cookie, else `401`.

    **Refusals.** An operation declining for an expected reason is an
    ANSWER, not an error: the status says why — `404` a subject that is
    not there, `409` a state that rules it out, `412` a head that moved
    from the one `If-Match` named, `422` input otaku cannot take, `502` a
    service that failed it — and the backend's sentence is the `detail`
    of an RFC 9457 problem body, shown verbatim. A fault is a problem
    body too, its status the whole of it: `400` a malformed request,
    `404` an unknown path, `405` a method the path does not take
    (`Allow`), `413`/`415` a body too large or not JSON, `428` a write
    that moves a head without `If-Match`, `500` a bug, `503` a server on
    its way out (`Retry-After`).

    **Caching.** None: every answer is `no-store`, read from disk per
    request. A message's pictures are the exception — a file never changes
    once written.

    Beside the API, the server serves the page itself from a closed
    asset table — not part of this reference.

tags:
  - name: Stories
    description: The stories, their copies, each one's settings, and its next request — the context it sends and how full that is.
  - name: Messages
    description: A story's chain — read, corrected, played on, a card brought in, regenerated, taken back.
  - name: Lore
    description: A story's memory — scenes, characters, journals — and the pass that builds it.
  - name: Transfer
    description: A story in and out as a document.
  - name: Codex
    description: The character cards every story may draw on — made by hand, from a card file or from a story's character, corrected, merged — and the stories' characters no card claims.
  - name: App
    description: otaku as it runs — the model in use and the one lore extraction asks, the launch, the machine.
  - name: Composer
    description: The composer's history, and the story's typed language.
  - name: Pictures
    description: The stored pictures — a message's and a card's.
  - name: Providers
    description: The providers, their models, and a model's own settings.
  - name: Integrations
    description: Web search's key, and a request to otaku's author.
  - name: Reports
    description: The tokens spent, what otaku knows, what the accounts have left.
  - name: Settings
    description: The installation's own settings.
  - name: Prompts
    description: What otaku tells the model — a tool's prompt, by the tool, the ones no tool owns, by their key — and the reminder every story may share.
  - name: Signing in
    description: The password, where one is set — neither lane, and the one door that is slow on purpose.
  - name: Server
    description: Neither lane — the server, not the app.

# Supergroups of the tags — the three groups the paths are laid out in.
# A vendor extension: Redoc and Scalar draw it, Swagger UI ignores it.
x-tagGroups:
  - name: Stories and what they hold
    tags: [Stories, Messages, Lore, Transfer]
  - name: What every story may draw on
    tags: [Codex]
  - name: The app around them
    tags: [App, Composer, Pictures, Providers, Integrations, Reports, Settings, Prompts]
  - name: The server
    tags: [Signing in, Server]

servers:
  - url: http://localhost:9600
    description: The default [web] address in configs/config.toml.

paths:
  # ==================================================================
  # STORIES — a story, and everything it holds
  # ==================================================================

  # ---------- Stories ----------

  /api/stories:
    get:
      operationId: listStories
      tags: [Stories]
      summary: Every story, most recently played first
      parameters:
        - name: query
          in: query
          schema: { type: string }
          description: Case-insensitive; a story matches on its current chain's text or on what its row shows — the ONE filter rule both browsers promise.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The stories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StorySummary" }
    post:
      operationId: createStory
      tags: [Stories]
      summary: Make a story
      description: |
        Made at once, with its title, its premise, or neither — in the
        browser before its first message. Every setting starts off. Given
        codex cards, it starts with them, in pick order: a card row and a
        character each, linked to its card, then the greeting of the first
        card that has one; an untitled one is named for them.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                premise: { type: string, description: "The system prompt, verbatim." }
                card_ids: { type: array, items: { type: integer }, description: "The codex cards it starts with, in pick order." }
                card_pictures: { type: array, items: { type: integer }, description: "The cards among them whose portrait rides their row." }
                persona: { type: string, description: "The reader's name the cards' {{user}} binds to." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "201":
          description: The story made; `Location` names it.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Story" } }

  /api/stories/{story}:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: getStory
      tags: [Stories]
      summary: One story
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The story.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
    patch:
      operationId: updateStory
      tags: [Stories]
      summary: Retitle a story, give it a premise, rewind it
      description: |
        A title is never emptied — clearing a title is not giving one. The
        premise is taken verbatim, "" clearing it. `head` rewinds the story
        to one of its messages: the messages after it stay in the tree, nothing
        is deleted — and moving the head takes `If-Match`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                premise: { type: string }
                head: { type: integer, description: "A message on the story's chain, which becomes its newest." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The story as it now stands.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Story" } }
        "412": { $ref: "#/components/responses/HeadMoved" }
        "428": { $ref: "#/components/responses/HeadRequired" }
    delete:
      operationId: deleteStory
      tags: [Stories]
      summary: Delete a story and everything it owns
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { type: "null" } }

  /api/stories/{story}/forks:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: listForks
      tags: [Stories]
      summary: The stories forks join it to
      description: Every other story a chain of forks joins this one to — the one it was forked from, its forks, theirs, and their siblings — most recently played first. A deleted story still joins the forks made from it.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The stories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StorySummary" }
    post:
      operationId: createFork
      tags: [Stories]
      summary: Continue in a copy
      description: A copy of the story from its head, or from one of its messages on; the original stays. A story with nothing played is refused (409).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                at: { type: [integer, "null"], description: "The message the copy is made from; null its head." }
                title: { type: string, description: '"" numbers the original''s: "<title> - N".' }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "201":
          description: The copy; `Location` names it.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Story" } }

  /api/stories/{story}/settings:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: listStorySettings
      tags: [Stories]
      summary: A story's settings
      description: In the order their texts share a place on the wire; a page draws them in its own caption table's order.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StorySetting" }

  /api/stories/{story}/settings/{setting}:
    parameters:
      - $ref: "#/components/parameters/Story"
      - $ref: "#/components/parameters/Setting"
    get:
      operationId: getStorySetting
      tags: [Stories]
      summary: One setting of a story
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The setting.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorySetting" }
    patch:
      operationId: updateStorySetting
      tags: [Stories]
      summary: Change one setting of a story
      description: The fields given, laid over it; what each may take is the setting's to refuse (422). A field of the wrong type is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                position:
                  description: '"system", or before the Nth of the reader''s messages counted from the end; one of `allowed_positions`.'
                  oneOf: [{ type: string, enum: [system] }, { type: integer, minimum: 1 }]
                reminder_text: { type: string }
                display_notes: { type: boolean }
                layout: { type: string, enum: [novel, canvas, manuscript, chat] }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The setting as it now stands.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/StorySetting" } }

  /api/stories/{story}/context:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: getContext
      tags: [Stories]
      summary: The story's next request, as it would be sent
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The context report.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextReport" }

  /api/stories/{story}/context/fill:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: getContextFill
      tags: [Stories]
      summary: How full the story's next request is
      description: The context report's own figure, read after every landing. Never waits on the internet; refused (404) while the model's window is not known — a figure against a stand-in would mislead.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The figure.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextFill" }

  # ---------- Messages ----------

  /api/stories/{story}/messages:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: listMessages
      tags: [Messages]
      summary: The story's chain, root to head
      parameters:
        - name: last
          in: query
          schema: { type: integer, minimum: 1 }
          description: Its last messages alone, each joined to the one before it all the same.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The messages, oldest first.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: createMessage
      tags: [Messages]
      summary: Play one line
      description: |
        `line` is PROSE and carries its own syntax verbatim — `/me`,
        `/you NAME`, `/ooc`, `/roll`, and `… /cue` or `… /ooc` inside it —
        read at the far end; in the canvas an empty line is the continue.
        Validation is eager: a line refused, a picture refused, a head
        that moved — answered as problems before anything is recorded or
        streamed. Then the whole exchange is ONE job: the reply arrives as a
        server-sent event stream, one JSON `PlayEvent` per `data:` frame,
        each message that lands told by its own event; closing the connection
        mid-stream is the cancel door, and what streamed is kept.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                line: { type: string }
                files:
                  type: array
                  description: |
                    The pictures the reader attached, as picked — the backend
                    normalises them: downsized, metadata stripped, PNG kept,
                    everything else made JPEG. Refused when the model cannot
                    see, when there are more than eight, or when one is no
                    picture; a `data` that is not base64 is a 400.
                  items:
                    type: object
                    required: [data]
                    properties:
                      name: { type: string, description: "What the reader called it; for the refusal sentences alone, never kept." }
                      data: { type: string, format: byte, description: "The file, base64." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The reply, as it arrives.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PlayEvent" }
        "412": { $ref: "#/components/responses/HeadMoved" }
        "428": { $ref: "#/components/responses/HeadRequired" }

  /api/stories/{story}/messages/{message}:
    parameters:
      - $ref: "#/components/parameters/Story"
      - $ref: "#/components/parameters/Message"
    get:
      operationId: getMessage
      tags: [Messages]
      summary: One message of the story's chain
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The message.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    patch:
      operationId: updateMessage
      tags: [Messages]
      summary: Correct a message
      description: The author's correction, on the story's current chain. The whitespace at its edges stays the stored one — a correction changes the words, never the join. An empty body is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The message as it now stands.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Message" } }

  /api/stories/{story}/cards:
    parameters:
      - $ref: "#/components/parameters/Story"
    post:
      operationId: createStoryCard
      tags: [Messages]
      summary: Bring a character card into the story — a card file, or a codex card
      description: |
        Always through the codex. A card's FILE, as bytes — a path over
        HTTP would name a file on the server — goes into the codex first:
        a file it holds already brings its card in, and `reuse` names the
        codex card the reader says it is. A codex card (`card_id`) is
        invited as it stands. With `validate_only`, the card is read and
        vetted and nothing is stored — what the persona ask is drawn from,
        the story's remembered persona its default. Without it, the card is
        brought in — played on from the head `If-Match` names: the typed
        row (the card's portrait on it where `with_pictures` asks), the
        character with the card's fields, linked to the codex card, the
        greeting message — and `/undo` takes the exchange whole, the codex
        card staying. The page sends the file both times: nothing waits on
        the server between the two.
      parameters:
        - $ref: "#/components/parameters/ValidateOnly"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A card file (`data` and `file_name`), or a codex card (`card_id`).
              properties:
                data: { type: string, format: byte, description: "The card file — PNG or JSON — base64." }
                file_name: { type: string }
                reuse: { type: integer, description: "The codex card the reader says the file is." }
                card_id: { type: integer, description: "A codex card, invited." }
                rename: { type: string, description: 'The name the card is brought in under; "" its own.' }
                persona: { type: string, description: "The reader's name the card's {{user}} binds to. Required to import." }
                with_pictures: { type: boolean, default: false, description: "Whether the card's portrait rides its row." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Vetted, nothing stored (`validate_only`).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryCardCheck" }
        "201":
          description: Imported; `Location` names the character the card became.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/ImportedCard" } }
        "412": { $ref: "#/components/responses/HeadMoved" }
        "428": { $ref: "#/components/responses/HeadRequired" }

  /api/stories/{story}/regens:
    parameters:
      - $ref: "#/components/parameters/Story"
    post:
      operationId: createRegen
      tags: [Messages]
      summary: Regenerate the standing reply
      description: |
        The standing reply set aside as a sibling — with its tool chain, one
        unit — and a fresh take streamed in its place: the stream of
        playing a line, with no user message. A POST because it is not
        idempotent: two calls leave two takes. Without a model, or with
        nothing to regenerate, it refuses before anything is dropped.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The fresh take, as it arrives.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PlayEvent" }
        "412": { $ref: "#/components/responses/HeadMoved" }
        "428": { $ref: "#/components/responses/HeadRequired" }

  /api/stories/{story}/undos:
    parameters:
      - $ref: "#/components/parameters/Story"
    post:
      operationId: createUndo
      tags: [Messages]
      summary: Take back the trailing exchange
      description: |
        What `/undo` does in the terminal: the reader's line and the reply
        unit it got, or a continue's reply alone. Nothing is deleted — the
        head moves back and the messages stay in the tree; an imported
        character whose card exchange was never played goes with it.
        Nothing to take back is refused (409). A POST because each call
        takes a different exchange — the one before, the next time — which
        `If-Match` makes safe to repeat.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The story as it now stands.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Story" } }
        "412": { $ref: "#/components/responses/HeadMoved" }
        "428": { $ref: "#/components/responses/HeadRequired" }

  # ---------- Lore ----------

  /api/stories/{story}/lore:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: getLore
      tags: [Lore]
      summary: The story's memory, in one read
      description: How far the extractor has read, and its scenes, characters and journals — read together, so a pass landing between two asks cannot hand the page a torn memory.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The memory.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lore" }

  /api/stories/{story}/scenes:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: listScenes
      tags: [Lore]
      summary: The story's scenes
      description: Its current scenes, in story order.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The scenes.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Scene" }

  /api/stories/{story}/scenes/{scene}:
    parameters:
      - $ref: "#/components/parameters/Story"
      - $ref: "#/components/parameters/Scene"
    get:
      operationId: getScene
      tags: [Lore]
      summary: One scene
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The scene.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scene" }
    patch:
      operationId: updateScene
      tags: [Lore]
      summary: Correct a scene
      description: Its two own fields. The arc (`history`) is derived and has no write — correcting the entries rebuilds it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                summary: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The scene as it now stands.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Scene" } }

  /api/stories/{story}/characters:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: listCharacters
      tags: [Lore]
      summary: The story's cast
      description: In appearance order — the composer's name menu among its readers.
      parameters:
        - name: name
          in: query
          schema: { type: string }
          description: The characters this name or alias finds, cased as the reader likes.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The characters.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Character" }

  /api/stories/{story}/characters/{character}:
    parameters:
      - $ref: "#/components/parameters/Story"
      - $ref: "#/components/parameters/Character"
    get:
      operationId: getCharacter
      tags: [Lore]
      summary: One character
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The character.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
    patch:
      operationId: updateCharacter
      tags: [Lore]
      summary: Correct a character, or link it to a codex card
      description: The description, and the profile an imported one carries — whole as TOML (`profile`; emptied to nothing included) or field by field (`profile_fields`, a field emptied leaving it) — and the codex card it is linked to (`card_id`; null unlinks), which changes nothing else on either. A link takes the character's copies along with `with_copies` — in every story forks join its own to, the one unlinked character of its very name, a story where the card links another already passed over. With `validate_only`, a link alone is vetted, nothing stored, answered with how many copies.
      parameters:
        - $ref: "#/components/parameters/ValidateOnly"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                profile: { type: string }
                profile_fields: { $ref: "#/components/schemas/ProfileFields" }
                portrait_sent: { type: boolean, description: "Whether the card's picture rides the row that brought the character in. Refused where no card row on the current timeline did, or there is no picture to send." }
                card_id: { type: [integer, "null"] }
                with_copies: { type: boolean, default: false, description: "With a card linked: its copies in forked stories linked too." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The character as it now stands; vetted, nothing stored (`validate_only`).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/Changed"
                      - properties: { value: { $ref: "#/components/schemas/Character" } }
                  - $ref: "#/components/schemas/CharacterLinkCheck"
    delete:
      operationId: deleteCharacter
      tags: [Lore]
      summary: Delete a character
      description: Refused while a pass is reading the story's cast.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Deleted.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { type: "null" } }

  /api/stories/{story}/characters/{character}/merges:
    parameters:
      - $ref: "#/components/parameters/Story"
      - $ref: "#/components/parameters/Character"
    post:
      operationId: createMerge
      tags: [Lore]
      summary: Fold a character into another
      description: The character the path names folded into the one `into` names — its name kept as an alias, its journals moved. Refused while a pass is reading the cast.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              properties:
                into: { type: integer, description: "The character it is folded into." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The character it was folded into, as it now stands.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Character" } }

  /api/stories/{story}/journals:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: listJournals
      tags: [Lore]
      summary: The story's journal records
      description: The records of its current timeline.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The journal records.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Journal" }

  /api/stories/{story}/journals/{journal}:
    parameters:
      - $ref: "#/components/parameters/Story"
      - $ref: "#/components/parameters/Journal"
    get:
      operationId: getJournal
      tags: [Lore]
      summary: One journal record
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
    patch:
      operationId: updateJournal
      tags: [Lore]
      summary: Correct a journal record's entry
      description: The state is the extractor's own — like both histories it has no write; correcting the entry is what moves the record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The record as it now stands.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Journal" } }

  /api/stories/{story}/extraction:
    parameters:
      - $ref: "#/components/parameters/Story"
    post:
      operationId: createExtraction
      tags: [Lore]
      summary: Run the extraction over the story now
      description: The gate and the settle margin dropped, closing right up to the last message. Answered at once, running — a pass already running is the one answered — and polled where `Location` says until it is done. Without a model to extract with, refused (409).
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "202":
          description: The pass, running; `Location` is where it is polled.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Extraction" } }
    get:
      operationId: getExtraction
      tags: [Lore]
      summary: The story's forced pass as it stands
      description: The one running, or the last one asked for; a story no pass was asked for is a 404.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The pass.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extraction" }
    delete:
      operationId: deleteExtraction
      tags: [Lore]
      summary: Give up the story's forced pass
      description: Nothing half-done commits; scenes already closed stay. None running is refused (409) — a pass can finish between the asking and this.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Given up.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { type: "null" } }

  # ---------- Transfer ----------

  /api/imports:
    post:
      operationId: createImport
      tags: [Transfer]
      summary: Land a document as a story
      description: |
        An otaku export, a SillyTavern chat, or plain text — the document's
        TEXT, as the page read it. A format that carries no memory starts
        the extraction pass on the story it landed (`value.extraction`),
        polled at the story's `…/extraction`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, file_name]
              properties:
                text: { type: string }
                file_name: { type: string, description: "Its extension and contents say the format." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "201":
          description: The story landed; `Location` names it.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Import" } }

  /api/stories/{story}/export:
    parameters:
      - $ref: "#/components/parameters/Story"
    get:
      operationId: getExport
      tags: [Transfer]
      summary: The story as one Markdown document
      description: Writing the file is the page's — a browser saves where the reader says, and the server never learns where. A story with nothing played is refused (409).
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The document.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }

  # ==================================================================
  # THE APP — the installation around the stories
  # ==================================================================

  # ---------- Codex ----------

  /api/cards:
    get:
      operationId: listCards
      tags: [Codex]
      summary: The codex's character cards, in the reader's order
      description: Every card in the reader's own order — a card made goes last — or those whose name, an alias or the tagline holds `query`, cased as the reader likes.
      parameters:
        - name: query
          in: query
          schema: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The cards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CardSummary" }
    post:
      operationId: createCard
      tags: [Codex]
      summary: Make a card — from a card file, a story's character, or by hand
      description: |
        Three ways, by what the body carries. A card FILE — `data`, base64,
        and the `file_name` it was picked as, `rename` overriding its own
        name: a file the codex holds already makes nothing and answers that
        card, `reuse` names the card the reader says it is (both `200`),
        and otherwise a card is made, a PNG's picture its portrait (`201`);
        with `validate_only` the file is read and vetted and nothing stored
        — the cards the codex may hold it as already. A story's character —
        `story_id` and `character_id`: promoted, its name, aliases and
        fields, and linked to it, its copies in forked stories too with
        `with_copies` (`201`); with `validate_only` vetted and nothing stored —
        how many copies. Otherwise the card's fields, by
        hand (`201`): with no `name`, the card is called "New card", for the
        reader to replace.
      parameters:
        - $ref: "#/components/parameters/ValidateOnly"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: A card file
                  type: object
                  required: [data, file_name]
                  properties:
                    data: { type: string, format: byte, description: "The card file — PNG or JSON — base64." }
                    file_name: { type: string }
                    rename: { type: string, description: 'The name the card is made under; "" its own.' }
                    reuse: { type: integer, description: "The card the reader says the file is: nothing is made, and the file is noted as that card's." }
                - title: A story's character
                  type: object
                  required: [story_id, character_id]
                  properties:
                    story_id: { type: integer }
                    character_id: { type: integer }
                    with_copies: { type: boolean, default: false, description: "Its copies in forked stories linked to the card too." }
                - title: By hand
                  allOf:
                    - $ref: "#/components/schemas/CardFields"
                    - not: { anyOf: [{ required: [data] }, { required: [story_id] }] }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Vetted, nothing stored (`validate_only`); or a card file the codex holds already.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CardCheck"
                  - $ref: "#/components/schemas/CharacterLinkCheck"
                  - allOf:
                      - $ref: "#/components/schemas/Changed"
                      - properties: { value: { $ref: "#/components/schemas/CardImport" } }
        "201":
          description: Made; `Location` names the card. A card file answers what it became (`CardImport`), the other two the card.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties:
                      value:
                        oneOf: [{ $ref: "#/components/schemas/CardImport" }, { $ref: "#/components/schemas/Card" }]

  /api/cards/unlinked:
    get:
      operationId: listUnlinkedCharacters
      tags: [Codex]
      summary: Every story's character no card claims
      description: The most written about first — by journal rows, then story, then appearance — or those whose name, an alias, or a journal record's entry or state holds `query`.
      parameters:
        - name: query
          in: query
          schema: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The characters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StoryCharacter" }

  /api/cards/{card}:
    parameters:
      - $ref: "#/components/parameters/Card"
    get:
      operationId: getCard
      tags: [Codex]
      summary: One card whole
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
    patch:
      operationId: updateCard
      tags: [Codex]
      summary: Correct a card
      description: The parts the body carries, each replacing what stood. `pictures` are each of the card's own by name, in the order they now stand, the first the portrait; a picture is removed on its own path. `before` moves the card in the reader's order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CardFields"
                - properties:
                    pictures:
                      type: array
                      items: { type: string }
                    before:
                      type: [integer, "null"]
                      description: The card this one now goes just before in the reader's order; null puts it last. Refused for a card the codex does not hold, or this one.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The card as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Card" } }
    delete:
      operationId: deleteCard
      tags: [Codex]
      summary: Delete a card
      description: Its pictures go with it; the story characters linked to it stay, unlinked and otherwise untouched.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { type: "null" } }

  /api/cards/{card}/pictures:
    parameters:
      - $ref: "#/components/parameters/Card"
    post:
      operationId: createCardPicture
      tags: [Codex]
      summary: Add a picture to a card
      description: After the card's others, read through the one intake every picture takes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, format: byte, description: "The picture, base64; its type is sniffed from the bytes." }
                name: { type: string, description: "What the reader called it — for a refusal's sentence alone." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The card as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Card" } }

  /api/cards/{card}/pictures/{name}:
    parameters:
      - $ref: "#/components/parameters/Card"
      - $ref: "#/components/parameters/Picture"
    delete:
      operationId: deleteCardPicture
      tags: [Codex]
      summary: Remove a picture from a card
      description: The file stays while a story's card row it rode names it.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The card as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Card" } }

  /api/cards/{card}/merges:
    parameters:
      - $ref: "#/components/parameters/Card"
    post:
      operationId: mergeCard
      tags: [Codex]
      summary: Fold a card into another
      description: Its story characters follow, its name becomes an alias of `into`, its pictures follow `into`'s. Refused where one story holds characters linked to both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              properties:
                into: { type: integer }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The card it went into, as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Card" } }

  # ---------- App ----------

  /api/app:
    get:
      operationId: getApp
      tags: [App]
      summary: otaku as it runs
      description: |
        Read off what is cached — nothing is asked of an engine. The model
        in use carries what it can do.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: otaku as it runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppInfo" }
    patch:
      operationId: updateApp
      tags: [App]
      summary: Switch the model, or pin the one lore extraction asks
      description: |
        Each field written in the order below — a refusal stops there, the
        field before it written — and each write's sentence joined into the
        notice. A field of the wrong type is a 400; a body naming neither is
        refused (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  description: The model played with from now on, its saved settings following it.
                  allOf: [{ $ref: "#/components/schemas/ModelRef" }]
                extraction_model:
                  description: The model lore extraction asks; null follows the model in use again.
                  oneOf: [{ $ref: "#/components/schemas/ModelRef" }, { type: "null" }]
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: otaku as it now runs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/AppInfo" } }

  /api/app/machine:
    get:
      operationId: getMachine
      tags: [App]
      summary: The machine a model fills
      description: One syscall, so the picker can watch the memory fill while a model loads.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The machine a model fills.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }

  # ---------- Composer ----------

  /api/history:
    get:
      operationId: listHistory
      tags: [Composer]
      summary: The lines submitted, most recent first
      description: The same lines the terminal prompt walks, so a reload, or the other frontend, starts with the history it left.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: string }
    post:
      operationId: createHistory
      tags: [Composer]
      summary: Keep one more line
      description: Fired beside every submission; blanks and immediate repeats are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The history as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties:
                      value:
                        type: array
                        items: { type: string }

  /api/language:
    get:
      operationId: getLanguage
      tags: [Composer]
      summary: The story's typed language
      description: NOT commands — the openers a line may start with and the inliners it may carry, tokens and argument shapes. What the composer's menu offers and the help sheet lists; the page captions them.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The language.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Language" }

  # ---------- Pictures ----------

  /api/pictures/{name}:
    parameters:
      - $ref: "#/components/parameters/Picture"
    get:
      operationId: getPicture
      tags: [Pictures]
      summary: A stored picture — a message's or a card's
      description: The bytes as stored, unsealed. A file never changes once written, so a browser may keep it a year.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The picture.
          content:
            image/jpeg: {}
            image/png: {}

  /api/pictures/{name}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/Picture"
    get:
      operationId: getThumbnail
      tags: [Pictures]
      summary: A picture's thumbnail
      description: Cut from the same image at intake, at most 512 pixels on a side. Kept like the picture.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The thumbnail.
          content:
            image/jpeg: {}

  # ---------- Providers ----------

  /api/providers:
    get:
      operationId: listProviders
      tags: [Providers]
      summary: Every provider, the slice asked for its models
      description: |
        Every provider in the panel's order — the supported ones in theirs —
        each saying whether it is configured, whether it was asked, and
        whether it answered; the ones that answered carry what they can do
        and their models. The picker asks in two phases, the providers on
        this machine first, so a slow catalog never holds the list up. An
        api key's VALUE never crosses; only where it comes from.
      parameters:
        - name: scope
          in: query
          schema: { type: string, default: "" }
          description: 'Which providers to ask: "" every one, "local" all but the hosted catalogs, "cloud" the catalogs and the generic provider, a provider''s id that one alone (a Test connection). A name no provider answers to is a 404.'
        - name: probe
          in: query
          schema: { type: boolean, default: true }
          description: "false asks nobody: the vocabulary, and the models in use as last listed."
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderListing" }

  /api/providers/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      operationId: getProvider
      tags: [Providers]
      summary: A provider's own section
      description: The panel's fields, nothing asked of the provider's server. A name no supported provider answers to is a 404.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
    patch:
      operationId: updateProvider
      tags: [Providers]
      summary: Save a provider's url or api key
      description: |
        Whichever the body names, in ONE write to providers.toml — a missing
        section is founded, which is how a cloud provider is added — live
        at once. A key is sealed; an EMPTY value forgets the field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                api_key: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The provider as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Provider" } }

  /api/providers/{provider}/models:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      operationId: listModels
      tags: [Providers]
      summary: The models a provider serves
      description: Asked of the provider now — which is how the picker learns what a load or an unload left loaded.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }

  /api/providers/{provider}/models/{model}:
    parameters:
      - $ref: "#/components/parameters/Provider"
      - $ref: "#/components/parameters/Model"
    patch:
      operationId: updateModel
      tags: [Providers]
      summary: Load or unload a model
      description: On a provider that manages its models; one that serves what it serves refuses (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loaded]
              properties:
                loaded: { type: boolean }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The model as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Model" } }

  /api/providers/{provider}/models/{model}/settings:
    parameters:
      - $ref: "#/components/parameters/Provider"
      - $ref: "#/components/parameters/Model"
    get:
      operationId: getModelSettings
      tags: [Providers]
      summary: A model's own settings
      description: |
        Its thinking level and its parameters as models.toml holds them,
        and what the model takes, as the provider has described it — every
        level and parameter where it cannot say or has not listed the
        model. Provider "" (no model selected) answers what any model would
        take.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The model's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSettings" }
    patch:
      operationId: updateModelSettings
      tags: [Providers]
      summary: Set a model's thinking level and parameters
      description: |
        Written in that order, a refusal stopping there. What the model
        takes is the backend's to refuse: a level it does not grade, an
        unknown parameter, a value it cannot read or out of bounds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                think:
                  description: 'A rung, "off" or "on", "unset" (saved: nothing is sent), or a budget in tokens.'
                  oneOf: [{ type: string }, { type: integer }]
                parameters:
                  type: object
                  description: "A parameter's name to its value — the kind's own, or as a reader types it — or null, which unsets it: the engine's own default applies."
                  additionalProperties: true
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The model's settings as they now stand.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/ModelSettings" } }

  # ---------- Integrations ----------

  /api/integrations/web-search:
    get:
      operationId: getWebSearch
      tags: [Integrations]
      summary: Whether web search holds a key
      description: The key's value never crosses.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Web search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearch" }
    patch:
      operationId: updateWebSearch
      tags: [Integrations]
      summary: Save web search's key
      description: Sealed into its section and live at once; "" forgets it. The key's own shape says which engine it belongs to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Web search as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/WebSearch" } }

  /api/integrations/support-requests:
    post:
      operationId: createSupportRequest
      tags: [Integrations]
      summary: Send a request to otaku's author
      description: Posted on through otaku.sh. An empty or too long body, and an address that is none, are refused before anything leaves; a failure to send is a 502.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                email: { type: [string, "null"], description: "Where an answer may go; null or absent, none given." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { type: "null" } }

  # ---------- Reports ----------

  /api/usage:
    get:
      operationId: getUsage
      tags: [Reports]
      summary: The tokens spent
      description: Grouped by what they were spent on, then by provider and model. Nothing recorded is refused (404).
      parameters:
        - name: story
          in: query
          schema: { type: integer }
          description: The story to count; every story where none is named.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }

  /api/info:
    get:
      operationId: getInfo
      tags: [Reports]
      summary: Everything otaku knows about this run
      parameters:
        - name: story
          in: query
          schema: { type: integer }
          description: The story whose block the report carries.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /api/balance:
    get:
      operationId: getBalance
      tags: [Reports]
      summary: What each cloud account has left
      parameters:
        - name: probe
          in: query
          schema: { type: boolean, default: true }
          description: false returns the roster without asking any network — keyed rows carry an empty note, not asked yet.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }

  # ---------- Settings ----------

  /api/settings:
    get:
      operationId: getSettings
      tags: [Settings]
      summary: The installation's settings
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The installation's settings, as their files stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [Settings]
      summary: Change the settings the body names
      description: |
        Each field written where it persists, in the order below — a
        refusal stops there, the fields before it written — and each
        write's sentence joined into the notice. A field of the wrong type
        is a 400; a body naming none of them is refused (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                last_story: { type: [integer, "null"], description: "The story landed in, by either frontend — the one a launch resumes; null none." }
                verbose: { type: boolean }
                autocorrect: { type: boolean }
                notification: { type: boolean }
                context_limit: { type: integer, minimum: 0, description: "The most tokens a request may use; 0 is none — the model's own context window." }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The settings as they now stand.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Settings" } }

  # ---------- Prompts ----------

  /api/tools/{tool}/prompt:
    parameters:
      - $ref: "#/components/parameters/Tool"
    get:
      operationId: getToolPrompt
      tags: [Prompts]
      summary: The prompt that tells the model how to use a tool
      description: As prompts.toml holds it now, a hand edit included — one text for every story that switched the tool on.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prompt" }
    patch:
      operationId: updateToolPrompt
      tags: [Prompts]
      summary: Write the tool's prompt
      description: Written into prompts.toml and read back — refused unless the file holds what was saved. An empty text restores the built-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The prompt as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Prompt" } }
    delete:
      operationId: deleteToolPrompt
      tags: [Prompts]
      summary: Restore the tool's built-in prompt
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The built-in, standing again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Prompt" } }

  /api/prompts/{prompt}:
    parameters:
      - $ref: "#/components/parameters/Prompt"
    get:
      operationId: getPrompt
      tags: [Prompts]
      summary: A prompt no tool owns
      description: As prompts.toml holds it now, a hand edit included — one text for every story. A tool's prompt is a 404 here, answered under its tool.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The prompt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prompt" }
    patch:
      operationId: updatePrompt
      tags: [Prompts]
      summary: Write the prompt
      description: Written into prompts.toml and read back — refused unless the file holds what was saved. An empty text restores the built-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The prompt as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Prompt" } }
    delete:
      operationId: deletePrompt
      tags: [Prompts]
      summary: Restore the built-in prompt
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The built-in, standing again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/Prompt" } }

  /api/shared-reminder:
    get:
      operationId: getSharedReminder
      tags: [Prompts]
      summary: The shared reminder
      description: One text, sent to every story that switched the shared reminder on; a story's own reminder is its setting's.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The shared reminder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedReminder" }
    patch:
      operationId: updateSharedReminder
      tags: [Prompts]
      summary: Write the shared reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: '"" clears it: a story that switched it on is then sent nothing for it.' }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The shared reminder as it now stands.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Changed"
                  - properties: { value: { $ref: "#/components/schemas/SharedReminder" } }

  # ==================================================================
  # THE SERVER — neither lane: it answers these itself, never touching the app
  # ==================================================================

  # ---------- Signing in ----------

  /api/login:
    get:
      operationId: getLogin
      tags: [Signing in]
      summary: Whether a password is asked for, and whether this browser is through it
      description: |
        Answered without a credential, by the handler thread itself. The
        page asks before it draws anything: the cookie is `HttpOnly`, so
        whether it holds a good one is the server's to say.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Whether a password is asked for, and whether this browser is through it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginState" }
    post:
      operationId: postLogin
      tags: [Signing in]
      summary: Sign in
      description: |
        The password in the body, answered without a credential and in
        neither lane. A good one answers `{}` with the token in an
        `HttpOnly`, `SameSite=Strict` cookie named for the port — `Secure`
        under TLS, kept 30 days when `remember` is true and 4 hours when
        it is not. With no password configured, every attempt is refused
        (409).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                remember: { type: boolean }
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: "Signed in: `{}` and the cookie."
          content:
            application/json:
              schema: { type: object }
        "401":
          description: Not the password. No cookie is set; the sentence is the problem's `detail`, and `WWW-Authenticate` a scheme no browser implements, so no browser dialog opens.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deleteLogin
      tags: [Signing in]
      summary: Sign out
      description: |
        Answers `{}` and clears the cookie — the page cannot, since it is
        not allowed to see it. The token itself is stateless: a copy kept
        elsewhere stays good until it runs out.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: Signed out.
          content:
            application/json:
              schema: { type: object }

  # ---------- Server ----------

  /api/app/status:
    get:
      operationId: getStatus
      tags: [Server]
      summary: What the backend is doing
      description: |
        Answered by the handler thread itself, never the app's — an otaku
        deep in a reply still answers, which is what makes this an answer
        about the SERVER. The page asks every few seconds; being answered
        is how it knows otaku is there.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: What the backend is doing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /api/watch:
    get:
      operationId: getWatch
      tags: [Server]
      summary: The files the page is made of, as they change
      description: |
        A server-sent event stream, held open for the life of the tab. The
        first frame names the reconnect interval (`retry:`); each following
        frame's `data:` is the bare NAME of a file that changed under the
        packaged `static/` or the reader's own state `web/` directory. The
        page swaps a stylesheet in place and reloads itself for anything
        else; a reopened stream is how a tab learns the server was
        restarted.
      responses:
        default: { $ref: "#/components/responses/Failed" }
        "200":
          description: The files the page is made of, as they change.
          content:
            text/event-stream: {}

components:
  parameters:
    Story:
      { name: story, in: path, required: true, schema: { type: integer }, description: "The story's id." }
    Message:
      { name: message, in: path, required: true, schema: { type: integer }, description: "A message's id, on the story's current chain." }
    Scene:
      { name: scene, in: path, required: true, schema: { type: integer } }
    Character:
      { name: character, in: path, required: true, schema: { type: integer } }
    Journal:
      { name: journal, in: path, required: true, schema: { type: integer } }
    Provider:
      { name: provider, in: path, required: true, schema: { type: string }, description: "The provider's id, which names its section: llamacpp, ollama, openrouter …" }
    Model:
      { name: model, in: path, required: true, schema: { type: string }, description: "The model's name as its provider lists it, percent-encoded — a slash as %2F." }
    Setting:
      { name: setting, in: path, required: true, schema: { type: string }, description: "A story setting's name: use_shared_reminder, use_story_reminder, allow_assistant_notes, allow_questions, allow_system_info, allow_web_search, emulate_text_completion, layout." }
    Tool:
      { name: tool, in: path, required: true, schema: { type: string }, description: "A tool's name, as a story setting's `tool` names it: question, note, system-info, web-search." }
    Prompt:
      { name: prompt, in: path, required: true, schema: { type: string }, description: "A prompt's prompts.toml key, as a story setting's `prompt_name` names it — one no tool owns: emulate_text_completion_prompt." }
    Card:
      { name: card, in: path, required: true, schema: { type: integer }, description: "A codex card's id." }
    Picture:
      { name: name, in: path, required: true, schema: { type: string }, description: "The picture's file name, as a message's attachments or a card's pictures carry it." }
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string }
      description: |
        The head this write moves from: the story's ETag as last read
        (`"<head>"`, `"0"` for none), or `*` for the head as it stands.
        Required by every write that moves the head — a PATCH only when
        it names `head`, a card import only without `validate_only`.
    ValidateOnly:
      { name: validate_only, in: query, schema: { type: boolean, default: false }, description: "Vet the write and store nothing: a refusal is the one the write would meet." }

  headers:
    ETag:
      description: 'The story''s head — the id of its newest message, "0" while it has none — as an entity tag: what a write that moves the head names in `If-Match`.'
      schema: { type: string, example: '"1042"' }
    Location:
      description: Where the thing made, or the work started, now lives.
      schema: { type: string }

  responses:
    Failed:
      description: |
        Declined, or not answered as asked — a problem body either way, the
        STATUS saying why. Declined: 404 a subject that is not there, 409 a
        state that rules the request out, 412 a head that moved, 422 input
        otaku cannot take, 502 a provider or service that failed it — the
        backend's own sentence in `detail`, which the page shows. Not
        answered: 400 a malformed request, 401 no credential where a
        password is asked for, 403 a write from somewhere that is not
        otaku's page, 404 a path nothing answers, 405 a method the path
        does not take (`Allow`), 413 a body over the limit, 415 a body that
        is not JSON, 421 a Host that does not name this machine, 428 a
        write that moves a head without `If-Match`, 500 a bug, 503 a server
        on its way out (`Retry-After`) — at most a developer's note in
        `detail`, which the page logs.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    HeadMoved:
      description: The head no longer stands where `If-Match` said — nothing was written. The problem's `head` and the `ETag` say where it stands now; the sentence is the `detail`.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    HeadRequired:
      description: A write that moves the head, sent without `If-Match`. A fault — the client owed the head it last read.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  # Alphabetical.
  schemas:
    AppInfo:
      type: object
      properties:
        version: { type: string }
        launch_facts: { $ref: "#/components/schemas/LaunchFacts" }
        model:
          description: The model in use; null with none.
          oneOf: [{ $ref: "#/components/schemas/ModelInUse" }, { type: "null" }]
        extraction_model:
          description: The model lore extraction asks; null with neither a pin nor a model in use.
          oneOf: [{ $ref: "#/components/schemas/ExtractionModel" }, { type: "null" }]
        on_cloud: { type: boolean, description: "A story played now leaves this machine — its model, or idle extraction's, is on a hosted catalog." }

    Attachment:
      type: object
      description: One picture on a message or a card — the file name the picture paths take, whose extension says the type, and its measure as the model sees it. The reader's file name is not kept.
      properties:
        file: { type: string, description: "pic-<story>-<day>-<8 hex> for a message's, crd-<card>-<day>-<8 hex> for a card's; .jpg or .png." }
        width: { type: integer }
        height: { type: integer }
        size: { type: integer, description: "Bytes, as stored." }

    Balance:
      type: object
      properties:
        total:
          description: Everything on account when one currency covers every row that answered; null when it does not — adding across currencies is a conversion, and otaku has no rate.
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        note: { type: string, description: "What the story on screen spends, in one sentence." }
        rows:
          type: array
          items:
            type: object
            properties:
              provider: { type: string, description: "The provider's id." }
              label: { type: string }
              money:
                description: What the account has left; null when it would not say.
                oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
              note: { type: string, description: 'Why there is no figure — "no key set", or the dash for an account that did not answer.' }
              value: { type: string, description: "The row as one string — the figure, or the note." }

    Card:
      type: object
      description: One codex card whole — its name, aliases and tagline (one line for the reader, never sent to the model), the card's fields with their macros as written, the file it came from ("" for none), its pictures in order (the first the portrait), the story characters it is linked to, and when it was last written.
      properties:
        id: { type: integer }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        tagline: { type: string }
        description: { type: string }
        personality: { type: string }
        scenario: { type: string }
        greeting: { type: string }
        alternate_greetings: { type: array, items: { type: string } }
        examples: { type: array, items: { type: string } }
        reminder: { type: string, description: "A standing rule, sent on its own before the reader's `reminder_depth`-th message from the end." }
        reminder_depth: { type: integer, minimum: 1, default: 2, description: "Before which of the reader's messages from the end the reminder goes, 1 the newest." }
        system_prompt: { type: string, description: "Joined to the system message of a story the card is in, after its premise." }
        post_history_instructions: { type: string, description: "Kept, sent nowhere." }
        creator_notes: { type: string }
        file_name: { type: string }
        pictures: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
        stories: { type: array, items: { $ref: "#/components/schemas/StoryCharacter" } }
        updated_at: { type: string, description: "For display alone." }

    CardCheck:
      type: object
      description: A card file read and vetted for the codex, nothing stored.
      properties:
        name: { type: string, description: "The name the card would take — its own, or the rename." }
        notes:
          type: array
          items: { type: string }
          description: What the import should say out loud.
        has_picture: { type: boolean, description: "Whether the file carries a picture." }
        same_card:
          description: The card the codex holds the file as already — importing it makes nothing; null where none.
          oneOf: [{ $ref: "#/components/schemas/CardSummary" }, { type: "null" }]
        similar_cards:
          type: array
          items: { $ref: "#/components/schemas/CardSummary" }
          description: The cards of the same name the reader may say it is (`reuse`).

    CardFields:
      description: A card's parts as a reader writes them — its name, aliases and tagline, and its profile's fields.
      allOf:
        - type: object
          properties:
            name: { type: string }
            aliases: { type: array, items: { type: string } }
            tagline: { type: string, description: "One line." }
        - $ref: "#/components/schemas/ProfileFields"

    CardImport:
      type: object
      description: What a card file became — the card, and whether it was made now (false where the codex held it already, or the reader said which card it is).
      properties:
        card: { $ref: "#/components/schemas/Card" }
        made: { type: boolean }

    CardSummary:
      type: object
      description: A card as the codex lists it.
      properties:
        id: { type: integer }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        tagline: { type: string }
        pictures: { type: array, items: { $ref: "#/components/schemas/Attachment" }, description: "In order, the first the portrait." }
        story_count: { type: integer, description: "How many stories it is in, one linked character in each." }

    Changed:
      type: object
      description: A write's answer — the thing as it now stands, and the sentence that says what was done, shown verbatim.
      required: [value, notice]
      properties:
        value: { description: "The thing written, as it now stands; null where nothing stands — a delete, a send." }
        notice: { type: string }

    Character:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        description: { type: string }
        profile: { type: [string, "null"], description: "The profile an imported character carries, a copy of its card's, as TOML; null for one the extractor named." }
        profile_fields:
          description: The same profile read field by field — every one, an empty one empty; null where there is none, or it is no TOML.
          oneOf:
            - $ref: "#/components/schemas/ProfileFields"
            - type: "null"
        history: { type: string, description: 'Their arc so far — the newest rollup a pass wrote, derived, no write; "" before the first.' }
        history_journal_id: { type: [integer, "null"], description: "The id of the journal record that arc was taken from — where a page says how old it is." }
        card_id: { type: [integer, "null"], description: "The codex card it is linked to; null for none." }
        card_name: { type: [string, "null"], description: "That card's name." }
        card_portrait:
          description: That card's portrait, its first picture; null for none.
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        portrait_sent: { type: [boolean, "null"], description: "Whether the card row that brought the character in, on the current timeline, carries the card's picture to the model; null where none did." }
        provider: { type: [string, "null"], description: "Who made the character: the engine of the pass that named them, or 'card'; null for an imported story's. An edit never changes it." }
        model: { type: [string, "null"], description: "The pass's model; null for a card's." }
        updated_at: { type: string, description: "When the extractor last wrote them — display alone." }

    CharacterLinkCheck:
      type: object
      description: A link to a card vetted before it is made, nothing stored — a story character linked, or promoted to a card of its own.
      properties:
        copies: { type: integer, description: "How many copies the write takes along with `with_copies`, in the stories forks join the character's own to." }

    ContextReport:
      type: object
      properties:
        shape:
          type: object
          description: What the next request is MADE of — the diagram's arithmetic.
          properties:
            head: { type: integer, description: "Opening messages, verbatim." }
            middle: { type: integer, description: "Messages the recap stands in for." }
            history: { type: boolean, description: "A story-so-far opens the recap." }
            rolled_up: { type: integer, description: "The scenes that story-so-far covers." }
            summaries: { type: integer, description: "Scene summaries riding after it." }
            tail: { type: integer, description: "Recent messages, verbatim." }
            tail_target: { type: integer, description: "The tail aimed for — below tail_setting, the limit forced it." }
            tail_setting: { type: integer, description: "The configured min_tail_messages." }
            system_tokens: { type: integer }
            transcript_tokens: { type: integer }
            limit: { type: integer, description: "What the prompt is measured against, the reply reserve taken off." }
            pictures_sent: { type: integer }
            pictures_held: { type: integer, description: "On earlier messages but held back: the engine puts every picture on the latest message." }
            pictures_omitted: { type: integer, description: "Not sent: the model cannot see, or the file is gone." }
            kept: { type: integer, description: "Derived: head + tail." }
            total_tokens: { type: integer, description: "Derived: system + transcript — or, over the text wire, the estimate of the one text as sent." }
            used: { type: integer, description: "Derived: percent of the limit, over 100 where the story cannot fit." }
        lede: { type: string, description: "The summary said in words." }
        note: { type: string, description: 'What the preview could not know; "" when it knew everything.' }
        cards:
          type: array
          description: The character cards the request carries, in the order sent — verbatim or whole in the recap — each costed with its portrait; the texts themselves are in the parts.
          items:
            type: object
            properties:
              name: { type: string, description: "The name it came in under." }
              tokens: { type: integer }
        injections:
          type: array
          description: What the request carries besides the story, in the order sent; the texts themselves are in the parts.
          items:
            type: object
            properties:
              label: { type: string }
              position:
                oneOf: [{ type: string, enum: [system] }, { type: integer, minimum: 1 }]
              position_text: { type: string, description: '"system", "2nd last" …' }
              tokens: { type: integer }
        parts:
          type: array
          description: One part per message, exactly as the wire will carry it — or, over the text wire, ONE part, role "prompt", the text as sent.
          items:
            type: object
            properties:
              role: { type: string }
              body: { type: string }
              pictures: { type: integer }

    ContextFill:
      type: object
      properties:
        percent: { type: integer, description: "Percent of the prompt's limit — over 100 where the story cannot fit even fully summarized." }
        context_in_force: { type: integer, description: "What the request is cut to: the model's context window, under the context limit." }
        text: { type: string, description: 'The figure in words — "41% of 32K".' }

    Export:
      type: object
      properties:
        name: { type: string, description: "The filename to save under." }
        text: { type: string, description: "The whole Markdown document." }

    Extraction:
      type: object
      description: A story's forced extraction pass as it stands.
      properties:
        story_id: { type: integer }
        status: { type: string, enum: [running, done, cancelled, failed] }
        report: { type: [string, "null"], description: "Once it is not running: scenes closed, journals written, too little new play yet, or what failed and why; null while it runs." }

    ExtractionModel:
      type: object
      properties:
        provider: { type: string, description: "The provider's id." }
        name: { type: string, description: "The model's name as state.toml names it." }
        listed_name: { type: string, description: "Its name as its provider lists it — where a picker rows it; the remembered spelling where the provider has not listed it." }
        pinned: { type: boolean, description: "Pinned for extraction; false while extraction follows the model in use." }

    Import:
      type: object
      properties:
        story_id: { type: integer }
        notices:
          type: array
          items: { type: string }
        extraction:
          description: The pass started on the story, for a format that carries no memory; null for one that does.
          oneOf: [{ $ref: "#/components/schemas/Extraction" }, { type: "null" }]

    ImportedCard:
      type: object
      properties:
        character_id: { type: integer, description: "The character the card became." }
        card_id: { type: integer, description: "The codex card it is linked to." }
        line: { $ref: "#/components/schemas/Message" }
        greeting:
          description: The card's greeting message; null where the card has none.
          oneOf: [{ $ref: "#/components/schemas/Message" }, { type: "null" }]
        report: { type: string }

    Info:
      type: object
      properties:
        sections:
          type: array
          items:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: array
                  description: One labeled fact — [label, value].
                  prefixItems: [{ type: string }, { type: string }]
                  minItems: 2
                  maxItems: 2
              note: { type: string, description: "The sentence standing where a block's facts would be." }

    Journal:
      type: object
      description: One character's line in one scene — the thing both lenses show.
      properties:
        id: { type: integer }
        scene_id: { type: integer }
        scene_no: { type: integer, description: "The scene's place in the story, 1-based." }
        character_id: { type: integer }
        entry: { type: string, description: "What they recorded." }
        state: { type: string, description: 'Where it left them; "" when the pass wrote none.' }
        history: { type: string }
        messages_since: { type: integer, description: "How far the story has moved past the scene, in messages." }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        updated_at: { type: string }

    LaunchFacts:
      type: object
      description: What the launch that opened the app had to say.
      properties:
        notices:
          type: array
          items: { type: string }
        hint: { type: string }
        newer_version:
          type: string
          description: The version the last update check found announced, where later than this otaku; empty for none.

    ListedProvider:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        locality: { type: string, enum: [local, remote, unknown], description: "Where its server runs, as its client knows it: the generic provider cannot say." }
        configured: { type: boolean, description: "A section is written for it." }
        url: { type: string, description: "The url its section holds — the supported provider's default where none is written; \"\" for a section no supported provider answers to." }
        asked: { type: boolean, description: "It was in the slice asked for its models." }
        answered: { type: boolean }
        failure: { type: [string, "null"], description: "Why it did not answer, in the package's own sentence; null when it did, or was not asked." }
        key_source: { type: [string, "null"], enum: [config, env, null], description: "Where the key in force comes from — never the value; null where there is none." }
        capabilities:
          description: What it can do; null where it did not answer.
          oneOf: [{ $ref: "#/components/schemas/ProviderCapabilities" }, { type: "null" }]
        models:
          type: array
          description: Where it answered; [] otherwise.
          items: { $ref: "#/components/schemas/Model" }

    LoginState:
      type: object
      required: [required, signed_in]
      properties:
        required: { type: boolean, description: "Whether `[web] password` is set, so the page asks for it." }
        signed_in: { type: boolean, description: "Whether this request carried a good credential; always false when `required` is false." }

    Lore:
      type: object
      properties:
        story_id: { type: integer }
        message_count: { type: integer, description: "The messages on the story's current chain." }
        extracted_up_to: { type: integer, description: "How far the extractor has read: a 1-based position on the chain, 0 for nothing yet. What lies past it is no fault — the settle margin leaves the newest messages open on purpose." }
        scenes:
          type: array
          items: { $ref: "#/components/schemas/Scene" }
        characters:
          type: array
          description: In appearance order.
          items: { $ref: "#/components/schemas/Character" }
        journals:
          type: array
          items: { $ref: "#/components/schemas/Journal" }

    Machine:
      type: object
      properties:
        memory: { type: string, description: 'The memory gauge — "RAM: 36.5 / 64.0 GB (57%)".' }

    Message:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [user, assistant, tool], description: "A tool message is a tool's result: nobody's line, no reply." }
        body: { type: string }
        kind: { type: string, enum: [dialogue, narration, ooc, card, tool, chapter], description: "A chapter is the row a `/chapter TITLE` line opens one with." }
        template: { type: [string, "null"] }
        speaker: { type: [string, "null"], description: "The extractor's name for who spoke; null until its pass reads the message." }
        provider: { type: [string, "null"], description: "Who made the message: an engine, 'card' on a card greeting, a tool's name on a tool message." }
        model: { type: [string, "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        mode: { type: string, enum: [story, chat], description: "The mode it was written in." }
        segments:
          type: array
          description: The body split in order — prose, and each tool call as its tool's facts; a user's line, its story and its words with the model; a chapter, its number and its title with the join between (joined, "Chapter 2. The Flood") — so a page draws a message without parsing it. The body stays whole above, for the editor.
          items:
            oneOf:
              - type: object
                properties:
                  kind: { const: prose }
                  text: { type: string }
              - type: object
                description: "A user's line's words with the model: all of a /you or /ooc line after its token, whatever follows a /ooc or /cue inliner."
                properties:
                  kind: { const: ooc }
                  text: { type: string }
              - type: object
                description: 'A chapter''s number, as its heading names it ("Chapter 2").'
                properties:
                  kind: { const: chapter_number }
                  text: { type: string }
              - type: object
                description: "A chapter's title."
                properties:
                  kind: { const: chapter_title }
                  text: { type: string }
              - type: object
                description: A tool call — a known tool's carries what it read; one of a name no tool owns, its tool and text alone.
                properties:
                  kind: { const: tool_call }
                  tool: { type: string }
                  label: { type: string }
                  actor: { type: string, enum: [nobody, user, system] }
                  text: { type: string }
                  question: { type: string, description: "A question's: the question itself." }
                  options:
                    type: array
                    items: { type: string }
                    description: "A question's: the answers to pick from."
        join_type: { type: string, enum: [inline, paragraph], description: "How it joins the message before it — the wire's own rule: inline, one space; paragraph, a blank line." }
        tool_label: { type: [string, "null"], description: "A tool message's tool as a frontend names it for the result it holds; null on every other message." }
        unit: { type: integer, description: "The first message of the reply unit it stands in — what undo and regenerate take as one." }

    Model:
      type: object
      properties:
        name: { type: string }
        size: { type: [integer, "null"], description: "Bytes on disk; null where the provider does not say." }
        context_window: { type: [integer, "null"], description: "What a request gets on the model: the loaded instance's context, or the model's own where loading is not a thing; null while not known." }
        context_length: { type: [integer, "null"], description: "The model's own maximum, where its provider states it." }
        context_loaded: { type: [integer, "null"], description: "What the running instance serves, while one runs." }
        max_output_tokens: { type: [integer, "null"] }
        capabilities:
          description: What the model can do as its provider states it; null where it says nothing of the model.
          oneOf: [{ $ref: "#/components/schemas/ModelCapabilities" }, { type: "null" }]
        state: { type: string, enum: [loaded, loading, unloaded, unknown], description: "Whether an instance serves it now." }
        locality: { type: [string, "null"], enum: [local, remote, unknown, null], description: "Where the model is served, where it differs from its provider's; null otherwise." }
        text_template: { type: [string, "null"], description: "The template the text wire wraps the story in for this model, as otaku resolves it; null where none is known." }
        reasoning_words: { type: string, description: 'The info report''s Reasoning row for the model, verbatim: the rungs, "on / off", "token budget", "not supported" or "unknown".' }
        capability_words: { type: string, description: "The info report's Capabilities row for the model, verbatim." }

    ModelCapabilities:
      type: object
      description: Each flag null where the provider cannot say.
      properties:
        vision: { type: [boolean, "null"] }
        audio: { type: [boolean, "null"] }
        supported_params: { type: [array, "null"], items: { type: string }, description: "Sorted by name; the listing's `parameters` is the vocabulary's order." }
        reasoning_efforts: { type: [array, "null"], items: { type: string }, description: "The rungs it grades, sorted by name; the listing's `effort_levels` is the ladder's order." }
        reasoning_switch: { type: [boolean, "null"] }
        reasoning_budget: { type: [boolean, "null"] }
        text_completion: { type: [boolean, "null"] }
        structured_output: { type: [boolean, "null"] }

    ModelInUse:
      type: object
      properties:
        provider: { type: string, description: "The provider's id." }
        name: { type: string, description: "The model's name as state.toml names it — what its own settings are saved under." }
        listed_name: { type: string, description: "Its name as its provider lists it — where a picker rows it; the remembered spelling where the provider has not listed it." }
        context_window: { type: [integer, "null"], description: "What a request gets on the model, as last listed — the loaded instance's context, or the model's own where loading is not a thing; null while not known." }
        capabilities:
          description: What the model can do as its provider states it; null where it says nothing of the model. A flag that is null reads as no.
          oneOf: [{ $ref: "#/components/schemas/ModelCapabilities" }, { type: "null" }]
        can_complete_text: { type: boolean, description: "The novel may be offered: the engine completes raw text and the template in force is plain." }
        can_attach: { type: boolean, description: "A picture may ride the first line of a story not made yet, in the layout a story starts in; a story's own is its can_attach." }

    ModelRef:
      type: object
      required: [provider, name]
      properties:
        provider: { type: string, description: "The provider's id." }
        name: { type: string, description: "The model's name as its provider lists it." }

    ModelSettings:
      type: object
      description: The settings of the model the path names.
      properties:
        think: { type: string, description: 'The level saved: a rung, "off", "on", a budget, or "unset".' }
        think_text: { type: string, description: "The level in words." }
        choices: { $ref: "#/components/schemas/ThinkChoices" }
        parameters:
          type: array
          description: Every parameter /set knows, in its order, each saying whether it reaches the model.
          items: { $ref: "#/components/schemas/ParameterSetting" }
        params:
          type: object
          description: The parameters saved, in the order the file holds them, each as a reader types it.
          additionalProperties: { type: string }
        text_template: { type: [string, "null"], description: "The models.toml text_template line; null where none is written." }

    Money:
      type: object
      description: An amount and its currency. `amount` is a DECIMAL STRING, never a JSON number — a figure somebody is billed against must not cross the wire as a float.
      properties:
        amount: { type: string, example: "4.82" }
        currency: { type: string, example: "USD" }
        text: { type: string, example: "$4.82" }

    ParameterSetting:
      type: object
      properties:
        name: { type: string }
        value: { description: "The value saved, of the parameter's kind; null where none is." }
        text: { type: string, description: 'The value as a reader types it; "" where none is saved.' }
        kind: { type: string, enum: [float, int, list] }
        supported: { type: boolean, description: "Whether it reaches the model in use." }
        low: { type: [number, "null"], description: "The bound the value is held to; null where none." }
        high: { type: [number, "null"] }

    PlayEvent:
      description: One frame of the reply stream, keyed by `type`. Every message that lands is told by its own event, the message as recorded.
      oneOf:
        - type: object
          description: The reader's message landed.
          properties:
            type: { const: user_message }
            message: { $ref: "#/components/schemas/Message" }
            note: { type: string, description: 'The record''s own dim line — the dice a /roll rolled; "" otherwise.' }
        - type: object
          description: A piece of the model's thinking, as it streams. Never stored.
          properties:
            type: { const: assistant_reasoning }
            text: { type: string }
        - type: object
          description: A piece of the reply's prose, as it streams.
          properties:
            type: { const: assistant_text }
            text: { type: string }
            join_type: { type: [string, "null"], enum: [inline, paragraph, null], description: "How the arriving reply joins the text before it, on the canvas — on the reply's first piece alone; null on every later piece." }
        - type: object
          description: A piece of a tool call — the tool's name and its inside, never a fence.
          properties:
            type: { const: assistant_tool_call }
            tool: { type: string, description: "The tool's name — question, note, system-info, web-search; a name no tool owns is a call all the same." }
            label: { type: string, description: 'What a frontend calls the tool; "" for a name no tool owns.' }
            actor: { type: [string, "null"], enum: [nobody, user, system, null], description: "Who acts on the call — nobody (an aside), the user (the reply ends there), the system (otaku runs the tool, and the reply goes on); null for a name no tool owns." }
            status: { type: string, description: "What the status row says while the call is made." }
            text: { type: string }
            closed: { type: boolean, description: "This piece is the one the closing fence ended." }
        - type: object
          description: The model's message landed, as recorded — it ends where the stream ended, at a tool call or at the reply's own end. The page lands it in place of what streamed.
          properties:
            type: { const: assistant_message }
            message: { $ref: "#/components/schemas/Message" }
        - type: object
          description: A tool ran and its message landed; the reply that goes on from it streams next, in the same stream.
          properties:
            type: { const: tool_message }
            message: { $ref: "#/components/schemas/Message" }
        - type: object
          description: The stream declines mid-way; what already happened stands.
          properties:
            type: { const: declined }
            reason: { type: string }
        - type: object
          description: The stream failed; what streamed is kept and recorded.
          properties:
            type: { const: failed }
            reason: { type: string }
        - type: object
          description: The stream's end. Every message landed before it.
          properties:
            type: { const: done }
            stats: { type: string, description: 'The verbose stats line the terminal prints after a reply; "" unless verbose is on.' }
            notice: { type: string, description: 'What the reader is told of the reply beyond its text — it was cut short at the reply limit; "" otherwise.' }
            report:
              type: [object, "null"]
              description: What the reply came to; null when the stream said nothing of itself.
              properties:
                total_seconds: { type: number }
                first_token_seconds: { type: [number, "null"] }
                prompt_tokens: { type: [integer, "null"] }
                cached_tokens: { type: [integer, "null"] }
                completion_tokens: { type: [integer, "null"] }
                context_in_force: { type: [integer, "null"], description: "What the request was cut to: the context window, under the context limit." }
                finish_reason: { type: [string, "null"] }
                truncated: { type: boolean }
                rate: { type: [number, "null"] }
                context_used: { type: [integer, "null"], description: "Percent of the context the prompt took, by the engine's own count." }

    Position:
      type: object
      description: Where an injected text rides — its value, and the text every frontend names it by.
      properties:
        value:
          oneOf: [{ type: string, enum: [system] }, { type: integer, minimum: 1 }]
        text: { type: string, description: '"system", "2nd last" …' }

    Problem:
      type: object
      description: RFC 9457 problem details — what is not a payload. `detail` is the backend's own sentence for a decline, a developer's note for a fault, absent where there is nothing to say.
      required: [type, title, status]
      properties:
        type: { type: string, const: "about:blank" }
        title: { type: string, description: "The status's phrase." }
        status: { type: integer }
        detail: { type: string }
        head: { type: [integer, "null"], description: "A 412's: where the head stands now." }

    ProfileFields:
      type: object
      description: A character's profile, field by field — a codex card's, or a story character's copy of one.
      properties:
        description: { type: string }
        personality: { type: string }
        scenario: { type: string }
        greeting: { type: string }
        alternate_greetings: { type: array, items: { type: string } }
        examples: { type: array, items: { type: string } }
        reminder: { type: string, description: "A standing rule, sent on its own before the reader's `reminder_depth`-th message from the end." }
        reminder_depth: { type: integer, minimum: 1, default: 2, description: "Before which of the reader's messages from the end the reminder goes, 1 the newest." }
        system_prompt: { type: string, description: "Joined to the system message of a story the card is in, after its premise." }
        post_history_instructions: { type: string, description: "Kept, sent nowhere." }
        creator_notes: { type: string }

    Prompt:
      type: object
      properties:
        name: { type: string, description: "The prompts.toml key it is kept under." }
        text: { type: string }

    Provider:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        locality: { type: string, enum: [local, remote, unknown] }
        configured: { type: boolean }
        url: { type: string }
        key_source: { type: [string, "null"], enum: [config, env, null] }

    ProviderCapabilities:
      type: object
      properties:
        tokenizer: { type: boolean, description: "The engine lends its own tokenizer: token counts are exact." }
        prompt_cache: { type: boolean, description: "Prompt-cache breakpoints are honoured." }
        model_management: { type: boolean, description: "Load and unload work." }
        supported_params:
          type: array
          items: { type: string }
          description: The parameters the wire reads, sorted by name; one outside it is not sent.
        bounds:
          type: object
          description: A parameter's bounds where the provider states its own, [low, high], either null.
          additionalProperties:
            type: array
            prefixItems: [{ type: [number, "null"] }, { type: [number, "null"] }]

    ProviderListing:
      type: object
      properties:
        providers:
          type: array
          description: Every provider, in the panel's order.
          items: { $ref: "#/components/schemas/ListedProvider" }
        parameters:
          type: array
          items: { type: string }
          description: Every parameter /set knows, in the vocabulary's order.
        effort_levels:
          type: array
          items: { type: string }
          description: The reasoning ladder's rungs, weakest to strongest.

    Question:
      type: object
      description: The question a story stands on — the questions tool on, and the newest reply's last call a question.
      properties:
        text: { type: string, description: "The call's inside, as written." }
        question: { type: string }
        options:
          type: array
          items: { type: string }
          description: The answers to pick from; [] for a free-form one.

    Scene:
      type: object
      properties:
        id: { type: integer }
        "no": { type: integer, description: "Its place in the story, 1-based." }
        span: { type: string, description: '"61-84"; "" when off the current chain.' }
        title: { type: string }
        summary: { type: string }
        history: { type: string, description: "The story-so-far THROUGH this scene. Derived — no write." }
        start_message_id: { type: integer }
        end_message_id: { type: integer }
        provider: { type: [string, "null"], description: "The engine of the pass that closed the scene; null for an imported story's." }
        model: { type: [string, "null"] }
        updated_at: { type: string, description: "When the extractor last wrote the scene — display alone." }

    Settings:
      type: object
      properties:
        last_story: { type: [integer, "null"], description: "The story last landed in, by either frontend — the one a launch resumes; null none, or one deleted since." }
        verbose: { type: boolean }
        autocorrect: { type: boolean }
        notification: { type: boolean }
        context_limit: { type: integer, description: "The most tokens a request may use; 0 is none — the model's own context window." }
        context_limit_text: { type: string, description: "The context limit as a sentence states it." }
        idle_seconds: { type: number, description: "How long the prompt stands idle before the lore pass runs on its own." }

    SharedReminder:
      type: object
      properties:
        text: { type: string, description: '"" for none.' }

    Status:
      type: object
      properties:
        status: { type: string, description: 'The backend''s one-line account of what it is doing; "" when idle.' }
        notices:
          type: array
          items: { type: string }

    Story:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, description: '"" where none is given.' }
        label: { type: string, description: "What a reader finds it by: the title, else its newest rollup, else its first prompt." }
        premise: { type: string, description: "The system prompt." }
        head: { type: [integer, "null"], description: "Its newest message's id — the ETag's — null while nothing is played." }
        message_count: { type: integer, description: "The messages on its current chain." }
        word_count: { type: integer, description: "The words on its current chain; an encrypted story's from before 0.9.0 are not counted." }
        updated_at: { type: string, format: date-time }
        layout: { type: string, enum: [novel, canvas, manuscript, chat] }
        mode: { type: string, enum: [story, chat], description: "The look its layout draws." }
        next_join: { type: [string, "null"], enum: [inline, paragraph, null], description: "How a line typed now would join the newest message, in the layout's mode; null while nothing is played." }
        completion_type: { type: string, enum: [chat, text], description: "The wire its next request goes over." }
        can_attach: { type: boolean, description: "A picture may ride its next request." }
        question:
          description: The question it stands on; null for none.
          oneOf: [{ $ref: "#/components/schemas/Question" }, { type: "null" }]
        shown_tools:
          type: array
          items: { type: string }
          description: The tools whose calls a reader is shown — question while its tool is on, note while the notes are on and displayed.
        folded_tools:
          type: array
          items: { type: string }
          description: The tools whose calls a frontend that can fold draws by their label alone, the text its hover hint — note while the notes are on and not displayed.

    StoryCardCheck:
      type: object
      description: A card read and vetted for a story, nothing stored.
      properties:
        name: { type: string, description: "The name it goes by — its own, or the rename." }
        notes:
          type: array
          items: { type: string }
          description: What the import should say out loud.
        block_tokens: { type: integer, description: "The composed block's cost estimate — it rides every request." }
        large: { type: boolean, description: "Worth warning about." }
        persona: { type: string, description: 'The persona the story remembers — the ask''s default; "" for none.' }
        has_picture: { type: boolean, description: "Whether the card has a portrait its row could carry." }
        same_card:
          description: For a file, the codex card it is already; null for none.
          oneOf: [{ $ref: "#/components/schemas/CardSummary" }, { type: "null" }]
        similar_cards:
          type: array
          items: { $ref: "#/components/schemas/CardSummary" }
          description: For a file, the codex cards of the same name the reader may say it is (`reuse`).

    StoryCharacter:
      type: object
      description: A story's character as the codex lists it.
      properties:
        story_id: { type: integer }
        story_label: { type: string, description: "The label a reader finds the story by." }
        character_id: { type: integer }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        journal_count: { type: integer, description: "Its journal rows, on any of the story's timelines." }

    StorySetting:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        tool: { type: [string, "null"], description: "The tool it switches on; null for a reminder, the emulation and the layout." }
        enabled: { type: boolean }
        injection_label: { type: [string, "null"], description: "The text it injects, lowercase; null for the layout." }
        prompt_name: { type: [string, "null"], description: "The prompts.toml key of the prompt it sends; null where the text is the reader's own, and for the layout." }
        injection_position:
          description: Where its text rides; null for one that injects nothing.
          oneOf: [{ $ref: "#/components/schemas/Position" }, { type: "null" }]
        allowed_positions:
          type: array
          description: The positions it may take — a closed list a page offers and decides nothing about.
          items: { $ref: "#/components/schemas/Position" }
        reminder_text: { type: [string, "null"], description: "The story reminder's own text; null for every other setting." }
        display_notes: { type: [boolean, "null"], description: "Whether the reader is shown the model's notes; null for every setting but the notes'." }
        layout: { type: [string, "null"], enum: [novel, canvas, manuscript, chat, null], description: "The layout the story is read in; null for every setting but the layout's." }

    StorySummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        label: { type: string }
        story_so_far: { type: string }
        first_message: { type: string, description: "The first line the reader played in it." }
        model: { type: string, description: "The model it was last played with." }
        updated_at: { type: string, format: date-time }
        message_count: { type: integer }
        word_count: { type: integer }

    Language:
      type: object
      description: The story's typed language, declared once in `context.syntax`.
      properties:
        prose: { type: string, description: "What a line with none of it does." }
        openers:
          type: array
          items: { $ref: "#/components/schemas/LanguageRow" }
        inliners:
          type: array
          items: { $ref: "#/components/schemas/LanguageRow" }

    LanguageRow:
      type: object
      properties:
        token: { type: string, example: "/you" }
        args: { type: string, description: "The argument's shape, as help spells it.", example: "NAME[: HINT]" }

    ThinkChoices:
      type: object
      properties:
        levels:
          type: array
          items: { type: string }
          description: The levels the model takes, in the shared order — a segmented control draws them, never re-sorts them.
        budget: { type: boolean, description: "A budget in tokens holds." }

    Usage:
      type: object
      properties:
        scope: { type: string, description: '"this story" or "all stories".' }
        rows:
          type: array
          items:
            type: object
            properties:
              purpose: { type: string }
              purpose_label: { type: string, description: "What the purpose is called." }
              provider: { type: string }
              model: { type: string }
              requests: { type: integer }
              prompt_tokens: { type: integer }
              completion_tokens: { type: integer }
              cached_tokens: { type: integer }
              rate: { type: number, description: "Completion tokens per second; 0.0 unmeasured." }
        requests: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cached_tokens: { type: integer }
        total_tokens: { type: integer }
        note: { type: string }

    WebSearch:
      type: object
      properties:
        has_key: { type: boolean }
