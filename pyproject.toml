[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otaku"
dynamic = ["version"]
description = "LLM frontend for roleplay"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "enclavum", email = "feedback@otaku.sh" }]
requires-python = ">=3.11"
# The GitHub repository topics, kept in step with them — one discovery
# vocabulary, whichever index a reader arrives from. `omlx`, `story` and `lore`
# are the three additions: otaku's own words for things, which no topic carries.
keywords = [
    "llm", "local-llm", "cli", "terminal", "tui", "web-ui",
    "ollama", "mlx", "omlx", "koboldcpp", "llamacpp", "lmstudio", "openrouter", "nanogpt",
    "roleplay", "ai-roleplay", "storytelling", "story", "lore",
    "interactive-fiction", "creative-writing", "sillytavern", "sillytavern-alternative",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]
# Floor = the version otaku is tested against, cap = the next major: both
# bounds mean something, and neither describes an install nobody performs.
dependencies = [
    "click>=8.4,<9.0",
    # cryptography's macOS wheels went arm64-only at 49, and 48 is the last
    # line with a universal2 build. Without the split, an Intel Mac finds no
    # wheel it can use and falls back to the sdist, which wants a Rust
    # toolchain — an install nobody performs, for the one platform that
    # cannot get the newer line.
    "cryptography>=49,<51; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "cryptography>=48,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "httpx>=0.28,<1.0",
    "prompt_toolkit>=3.0.53,<4.0",
]

[project.urls]
Homepage = "https://otaku.sh"
Repository = "https://github.com/enclavum/otaku"
Issues = "https://github.com/enclavum/otaku/issues"

[project.scripts]
otaku = "otaku.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

# The one source of the version is the code: otaku/__init__.py.__version__.
[tool.hatch.version]
path = "otaku/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["otaku"]

# The README's pictures are for GitHub, not for the source tarball.
[tool.hatch.build.targets.sdist]
exclude = ["images/"]

[tool.ruff]
line-length = 100
# The supported floor, not the interpreter in use: syntax newer than this
# (PEP 695 generics, PEP 758 unparenthesized excepts) is a SyntaxError on
# the older versions otaku supports, and only this catches it here.
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL statements are kept on two rows with their parameters on one, whatever
# the width (see the store modules' `# fmt: off` blocks).
"otaku/store/*" = ["E501"]
# The command surface: one help row per source line, whatever the width
# (see the `# fmt: off` block).
"otaku/backend/commands.py" = ["E501"]
# The rendered config: one setting per source line, whatever the width
# (see the `# fmt: off` block in to_toml).
"otaku/settings/config.py" = ["E501"]
"tests/*" = ["RUF001"]
"scenarios/*" = ["RUF001"]

[tool.mypy]
strict = true
files = ["otaku"]
python_version = "3.11"  # type-check against the floor, not the interpreter in use

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real provider (each smoke skips itself when its server or api key is absent)",
    "cli: drives the real binary in a subprocess or a pty — the slow end of the suite",
]
addopts = "-q"
