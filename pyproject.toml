[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otaku"
version = "0.2.0"
description = "A roleplay terminal client"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1,<9.0",
    "cryptography>=44,<50",
    "httpx>=0.27,<1.0",
    "prompt_toolkit>=3.0.43,<4.0",
    "psutil>=6,<8",
]

[project.scripts]
otaku = "otaku.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.15",
    "types-psutil>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["otaku"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL statements are kept on two rows with their parameters on one, whatever
# the width (see the store modules' `# fmt: off` blocks).
"otaku/store/*" = ["E501"]

[tool.mypy]
strict = true
files = ["otaku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
