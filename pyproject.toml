[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otaku"
dynamic = ["version"]
description = "A roleplay terminal client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "enclavum", email = "293312193+enclavum@users.noreply.github.com" }]
requires-python = ">=3.14"
keywords = ["llm", "ollama", "mlx", "omlx", "koboldcpp", "terminal", "tui", "roleplay", "story", "lore", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "click>=8.1,<9.0",
    "cryptography>=44,<50",
    "httpx>=0.27,<1.0",
    "prompt_toolkit>=3.0.43,<4.0",
    "psutil>=6,<8",
]

[project.urls]
Homepage = "https://github.com/enclavum/otaku"
Repository = "https://github.com/enclavum/otaku"
Issues = "https://github.com/enclavum/otaku/issues"

[project.scripts]
otaku = "otaku.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.15",
    "types-psutil>=6",
]

# The one source of the version is the code: otaku/__init__.py.__version__.
[tool.hatch.version]
path = "otaku/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["otaku"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL statements are kept on two rows with their parameters on one, whatever
# the width (see the store modules' `# fmt: off` blocks).
"otaku/store/*" = ["E501"]
"tests/*" = ["RUF001"]
"scenarios/*" = ["RUF001"]

[tool.mypy]
strict = true
files = ["otaku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real local model (skips itself when ollama or the model is absent)",
]
addopts = "-q"
