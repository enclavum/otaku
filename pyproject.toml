[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otaku"
dynamic = ["version"]
description = "A roleplay terminal client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "enclavum", email = "293312193+enclavum@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["llm", "ollama", "mlx", "omlx", "koboldcpp", "terminal", "tui", "roleplay", "story", "lore", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]
# Floor = the version otaku is tested against, cap = the next major: both
# bounds mean something, and neither describes an install nobody performs.
dependencies = [
    "click>=8.4,<9.0",
    "cryptography>=49,<51",
    "httpx>=0.28,<1.0",
    "prompt_toolkit>=3.0.53,<4.0",
    "psutil>=7,<8",
]

[project.urls]
Homepage = "https://github.com/enclavum/otaku"
Repository = "https://github.com/enclavum/otaku"
Issues = "https://github.com/enclavum/otaku/issues"

[project.scripts]
otaku = "otaku.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "types-psutil>=7,<8",
]

# The one source of the version is the code: otaku/__init__.py.__version__.
[tool.hatch.version]
path = "otaku/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["otaku"]

[tool.ruff]
line-length = 100
# The supported floor, not the interpreter in use: syntax newer than this
# (PEP 695 generics, PEP 758 unparenthesized excepts) is a SyntaxError on
# the older versions otaku supports, and only this catches it here.
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL statements are kept on two rows with their parameters on one, whatever
# the width (see the store modules' `# fmt: off` blocks).
"otaku/store/*" = ["E501"]
# The command table: one help row / one dispatch entry per source line,
# whatever the width (see the `# fmt: off` blocks).
"otaku/chat/commands/__init__.py" = ["E501"]
# The rendered config: one setting per source line, whatever the width
# (see the `# fmt: off` block in to_toml).
"otaku/settings/config.py" = ["E501"]
"tests/*" = ["RUF001"]
"scenarios/*" = ["RUF001"]

[tool.mypy]
strict = true
files = ["otaku"]
python_version = "3.11"  # type-check against the floor, not the interpreter in use

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real local model (skips itself when ollama or the model is absent)",
]
addopts = "-q"
